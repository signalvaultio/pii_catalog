name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.7"
            otp: "26.2"
          - elixir: "1.18.4"
            otp: "27.3.4.2"
            lint: true
          - elixir: "1.19.5"
            otp: "28.3"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        if: matrix.lint
        run: mix credo --strict

      - name: Test
        run: mix test

      - name: README table matches the catalog
        if: matrix.lint
        run: MIX_ENV=dev mix pii_catalog.readme --check

      - name: Docs
        if: matrix.lint
        run: MIX_ENV=dev mix docs --warnings-as-errors

      - name: Package builds
        if: matrix.lint
        run: MIX_ENV=dev mix hex.build

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4.2"

      - name: Cache deps, build and PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - name: Install dependencies
        run: mix deps.get

      - name: Dialyzer
        run: mix dialyzer --format github
